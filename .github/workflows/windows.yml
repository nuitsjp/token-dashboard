name: Windows checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        directory: [., reference]
    runs-on: windows-latest
    env:
      # The D: drive of the runner is much faster than C:, where restoring the Go cache took 55 seconds.
      GOCACHE: D:\go\cache
      GOMODCACHE: D:\go\mod
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      # setup-go caches under a key that does not change with the cache folders, so a cache saved from
      # C: would be restored there. This cache keeps the D: folders above under its own key.
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.directory }}/go.mod
          cache: false
      - uses: actions/cache@v4
        with:
          path: |
            D:\go\cache
            D:\go\mod
          key: go-d-${{ runner.os }}-${{ matrix.directory }}-${{ hashFiles(format('{0}/go.sum', matrix.directory)) }}
          restore-keys: go-d-${{ runner.os }}-${{ matrix.directory }}-
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ matrix.directory }}/.nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Building the Wails CLI took about 50 seconds. setup keeps a restored CLI of the same version.
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.directory }}/.tools
          key: wails-cli-${{ runner.os }}-${{ hashFiles(format('{0}/go.mod', matrix.directory)) }}
      - name: Dependencies and generated sources
        run: node scripts/run.mjs setup
      - name: Browser
        working-directory: ${{ matrix.directory }}/frontend
        run: npx playwright install --only-shell chromium
      - name: Verify
        run: node scripts/run.mjs verify
      - name: Windows executable
        run: node scripts/run.mjs build
      - name: NSIS
        run: choco install nsis --yes --no-progress
      - name: Installer
        run: node scripts/run.mjs package
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-${{ matrix.directory == '.' && 'project' || 'reference' }}
          path: ${{ matrix.directory }}/bin/*-setup.exe
