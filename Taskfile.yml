version: '3'

# 並列に実行するタスクの出力を、行ごとにタスク名を付けて区別する。
output: prefixed

vars:
  # 生成先の reference/ は親ディレクトリの共通検査器を使う。
  DOC_CHECK: '{{if eq (osBase .ROOT_DIR) "reference"}}../{{end}}scripts/doc_check.py'

tasks:
  generate:
    # verify の中で build:server からも呼ばれるため、1回の実行では1度だけ生成する。
    run: once
    cmds:
      - wails3 generate bindings -ts -i -names -f '-tags=server' -d frontend/bindings .
      - npm --prefix frontend run routes
  frontend:dev:
    dir: frontend
    cmds: [npm run dev]
  build:dev:
    cmds:
      - task: generate
      - npm --prefix frontend run build:dev
      - node scripts/build.mjs desktop-dev
  run:
    cmds: [node scripts/build.mjs run]
  build:
    cmds:
      - task: generate
      - npm --prefix frontend run build
      - node scripts/build.mjs desktop
  build:server:
    cmds:
      - task: generate
      - npm --prefix frontend run build
      - node scripts/build.mjs server
  server:
    cmds:
      - task: build:server
      - node scripts/build.mjs run-server
  package:
    cmds:
      - task: build
      - node scripts/build.mjs package
  test:core:
    cmds: [go test ./internal/... ./cmd/release/...]
  # 画面の検査と検証用サーバーのビルドは frontend/ を書き換えるため、この順に1本で実行する。
  check:frontend:
    cmds:
      - npm --prefix frontend run typecheck
      - npm --prefix frontend run lint
      - npm --prefix frontend run test
      - task: build:server
  check:go:
    cmds: [go test ./internal/... ./cmd/release/...]
  check:vet:
    cmds: [go vet ./...]
  check:vet-server:
    cmds: [go vet -tags server ./...]
  check:docs:
    cmds:
      - python {{.DOC_CHECK}} .
  # 生成のあと、互いに関係のない検査を並列に実行し、すべて合格したら E2E を実行する。
  checks:
    deps: [check:frontend, check:go, check:vet, check:vet-server, check:docs]
  verify:
    cmds:
      - task: generate
      - task: checks
      - npm --prefix frontend run test:e2e
